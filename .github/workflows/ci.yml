name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A superseded push should stop costing money. Without this, pushing twice to
  # an open PR leaves the first run burning minutes to completion for a commit
  # nobody is waiting on any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build
