allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true

# Transitive-dependency floors that close Dependabot security alerts.
#
# These used to live in package.json under "pnpm.overrides". pnpm 11 stopped
# reading that block, and Dependabot's pnpm moved past 11 in September 2026,
# so every lockfile it regenerated silently dropped the pins and then failed
# the frozen install (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH) on CI and Vercel.
# pnpm-workspace.yaml is read by pnpm 10, 11 and 12 alike.
#
# Floor = the first patched version named by the alert. Raise, never lower.
overrides:
  h3: ">=1.15.11"
  "picomatch@>=4": ">=4.0.4"
  "picomatch@<4": ">=2.3.2"
  defu: ">=6.1.6"
  devalue: ">=5.9.3"
  tar: ">=7.5.21"
  smol-toml: ">=1.7.1"
  "path-to-regexp@>=6 <7": ">=6.3.0"
  yaml: ">=2.8.3"
  postcss: ">=8.5.23"
  fast-uri: ">=3.1.6"
  "brace-expansion@>=4": ">=5.0.11"
  esbuild: ">=0.28.1"
  "js-yaml@>=4": ">=4.3.2"
  "baseline-browser-mapping@>=2": ">=2.11.0"
  browserslist: ">=4.28.7"
  "nanoid@<4": ">=3.3.18"
  "svgo@>=4": ">=4.1.0"
  "@babel/core": ">=7.29.6"
